name: Research checks
on:
  push:
  pull_request:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/pyproject.toml
      - run: make setup
      - run: make test
      - run: make smoke
