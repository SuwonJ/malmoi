name: C core compatibility
on:
  push:
  pull_request:
env:
  PYTHONUTF8: '1'
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: ${{ matrix.cc }} --version
      - run: make core-test demo-b demo-c demo-d CC=${{ matrix.cc }}
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make sanitize CC=clang
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build C11 core and examples with MSVC
        shell: cmd
        run: |
          python -c "from pathlib import Path; Path('build/core').mkdir(parents=True, exist_ok=True)"
          cl /nologo /std:c11 /W4 /WX /utf-8 /Iinclude src\vecdb.c tests\test_vecdb.c /Febuild\core\test_vecdb.exe
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:build\core\malmoi.lib vecdb.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /utf-8 /Iinclude src\vecdb.c examples\inspect.c /Febuild\core\inspect.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /utf-8 /Iinclude src\vecdb.c examples\word_demo.c /Febuild\core\word_demo.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /utf-8 /Iinclude src\vecdb.c examples\sense_demo.c /Febuild\core\sense_demo.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /utf-8 /Iinclude src\vecdb.c examples\game_demo.c /Febuild\core\game_demo.exe
          if errorlevel 1 exit /b 1
      - name: Test the same binary format on Windows
        shell: pwsh
        run: |
          python tools/make_fixture.py --count 1000 --output build/fixtures/dev-1000.mlm --export-input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/core/test_vecdb.exe build/fixtures/dev-1000.mlm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/test_compatibility.py --inspect build/core/inspect.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/core/word_demo.exe build/fixtures/dev-1000.mlm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/core/sense_demo.exe build/fixtures/dev-1000.mlm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/core/game_demo.exe build/fixtures/dev-1000.mlm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
